        // 啟動對話流程
        function startChat() {
            displayBotMessage(questions[currentQuestionIndex]);
            chatInput.disabled = false;
            chatSendBtn.disabled = false;
            chatInput.focus();
        }

        async function handleUserMessage() {
            const message = chatInput.value.trim();
            if (!message) return;

            displayUserMessage(message);
            chatInput.value = '';
            chatInput.disabled = true;
            chatSendBtn.disabled = true;
            chatInput.placeholder = 'AI 正在分析您的回覆...';
            displayTypingIndicator(); // 顯示"輸入中"

            const currentQuestion = questions[currentQuestionIndex];

            try {
                const response = await fetch(`${URL}/api/validate-answer`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: currentQuestion, answer: message })
                });
                const validation = await response.json();
                chatInput.placeholder = '請在這裡輸入...';
                removeTypingIndicator(); // 移除"輸入中"

                if (validation.is_relevant) {
                    userAnswers.push(message);
                    currentQuestionIndex++;

                    if (currentQuestionIndex < questions.length) {
                        displayBotMessage(questions[currentQuestionIndex]);
                        chatInput.disabled = false;
                        chatSendBtn.disabled = false;
                        chatInput.focus();
                    } else {
                        displayBotMessage("好的，謝謝您的回答。我們正在為您分析最適合的科別...");
                        analyzeSymptoms();
                    }
                } else {
                    displayBotMessage(validation.feedback);
                    chatInput.disabled = false;
                    chatSendBtn.disabled = false;
                    chatInput.focus();
                }
            } catch (error) {
                removeTypingIndicator();
                console.error("Validation API error:", error);
                displayBotMessage("不好意思，系統暫時無法驗證您的回答，讓我們直接跳到下一題。");
                userAnswers.push(message);
                currentQuestionIndex++;
                if (currentQuestionIndex < questions.length) {
                    displayBotMessage(questions[currentQuestionIndex]);
                    chatInput.disabled = false;
                    chatSendBtn.disabled = false;
                    chatInput.focus();
                } else {
                     displayBotMessage("好的，謝謝您的回答。我們正在為您分析最適合的科別...");
                     analyzeSymptoms();
                }
            }
        }

        function displayTypingIndicator() {
            const typingElement = document.createElement('div');
            typingElement.className = 'chat-message bot-message typing-indicator-container';
            typingElement.innerHTML = `
                <i class="fa-solid fa-robot message-icon"></i>
                <div class="message-bubble typing-indicator">
                    <span></span><span></span><span></span>
                </div>
            `;
            chatWindow.appendChild(typingElement);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function removeTypingIndicator() {
            const indicator = chatWindow.querySelector('.typing-indicator-container');
            if (indicator) indicator.remove();
        }

        // 顯示機器人訊息
        function displayBotMessage(message) {
            const messageElement = document.createElement('div');
            messageElement.className = 'chat-message bot-message';
            messageElement.innerHTML = `
                <i class="fa-solid fa-robot message-icon"></i>

            `;
            chatWindow.appendChild(messageElement);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

            chatWindow.appendChild(messageElement);

        }

        // 【修改】重新分析相關函式
        function restartChat() {

            userAnswers = [];

        function cancelRestart() {
            step1Body.classList.add('d-none');

        // 組合答案並呼叫後端 API
        async function analyzeSymptoms() {
            // 組合一個完整的摘要
            const summary = `
                主要症狀: ${userAnswers[0] || '未提供'}。
                持續時間: ${userAnswers[1] || '未提供'}。
                伴隨症狀: ${userAnswers[2] || '未提供'}。
                過去病史: ${userAnswers[3] || '未提供'}。
            `;
            suggestionResult.classList.remove('d-none');
                        
            // 使用舊的 suggestDepartment API 端點，傳入我們的摘要
            try {
                const response = await fetch(`${URL}/api/suggest-department`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ symptoms: summary.trim() })
                });

                // 【升級】處理後端回傳的完整分析結果
                const data = await response.json();

                if (data.error) {
                    suggestionResult.innerHTML = `<div class="alert alert-danger">分析時發生錯誤: ${data.error}</div>`;
                    return;
                }
                
                // 處理緊急狀況
                if (data.emergency) {
                    suggestionResult.innerHTML = `
                        <div class="alert alert-danger">
                            <h4 class="alert-heading">緊急狀況警告！</h4>
                            <p>您描述的症狀包含「<b>${data.matched_keyword}</b>」，這可能屬於緊急情況。</p>
                            <hr>
                            <p class="mb-0 fw-bold">請立即撥打 119 或前往就近的急診室尋求協助。</p>
                        </div>`;
                    return;
                }

                // 顯示 Gemini 的分析結果
                if (data.department) {
                    const recommendedDept = data.department;
                    const urgency = data.urgency_level || '未評估';
                    const reason = data.recommendation_reason || '無';

                    let alertClass = 'alert-success';
                    if (urgency === '建議盡快就醫') {
                        alertClass = 'alert-warning';
                    }

                    suggestionResult.innerHTML = `
                        <div class="alert ${alertClass}">
                            <h5 class="alert-heading">AI 分析結果</h5>
                            <p class="mb-1"><b>建議科別：</b> ${recommendedDept}</p>
                            <p class="mb-1"><b>緊急程度：</b> ${urgency}</p>
                            <p class="mb-2"><b>判斷原因：</b> ${reason}</p>
                            <hr>
                            <button class="btn btn-primary" onclick="enableStep2('${recommendedDept}')">
                                太好了！開始搜尋「${recommendedDept}」的診所
                            </button>
                        </div>`;
                } else {
                    suggestionResult.innerHTML = `<div class="alert alert-secondary">AI 助理無法判斷最適合的科別，建議您直接選擇「家庭醫學科」或「西醫一般科」進行諮詢。</div>`;
                }
            } catch (error) {
                console.error("分析症狀時發生錯誤:", error);
                suggestionResult.innerHTML = `<div class="alert alert-danger">分析時發生錯誤，建議您直接尋求醫療協助。</div>`;
            }
        }


        function initializeMap() {
            if (!map) {
                map = L.map('map').setView([25.033, 121.565], 11);

                // 設定地圖樣式選擇器
                const mapStyleSelect = document.getElementById('map-style-select');
                for (const styleKey in tileLayers) {
                    const option = document.createElement('option');
                    option.value = styleKey;
                    option.textContent = tileLayers[styleKey].name;
                    mapStyleSelect.appendChild(option);
                }

                // 監聽選擇器的變更事件
                mapStyleSelect.addEventListener('change', (e) => {
                    changeMapLayer(e.target.value);
                });

                // 根據當前主題設定初始圖層
                const currentTheme = document.body.classList.contains('dark-mode') ? 'dark' : 'light';
                const initialLayerKey = currentTheme === 'dark' ? 'cartoDark' : 'cartoLight';
                changeMapLayer(initialLayerKey);
                mapStyleSelect.value = initialLayerKey;

                // L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' }).addTo(map);
                // 【修改】將 markerClusterGroup 加入地圖
                map.addLayer(markerClusterGroup);
                userMarkerLayer = L.featureGroup().addTo(map);
            }
        }


        //切換地圖底圖，並智能判斷是否套用濾鏡
        function changeMapLayer(layerKey) {
            if (currentTileLayer) {
                map.removeLayer(currentTileLayer);
            }
            const layerInfo = tileLayers[layerKey];
            currentTileLayer = L.tileLayer(layerInfo.url, layerInfo.options);
            currentTileLayer.addTo(map);

            // 智能判斷是否需要套用CSS濾鏡
            const tilePane = currentTileLayer.getContainer();
            if (document.body.classList.contains('dark-mode') && !layerInfo.isDark) {
                // 如果是暗黑模式，且地圖本身不是暗色系，則套用濾鏡
                tilePane.classList.add('map-force-dark');
            } else {
                // 其他情況則移除濾鏡
                tilePane.classList.remove('map-force-dark');
            }
        }
        
        function loadDepartments(){
            fetch(`${URL}/api/departments`)

        async function suggestDepartment() {
            const symptoms = symptomInput.value;
            if (!symptoms.trim()) {
                suggestionResult.innerHTML = `<div class="alert alert-warning">請輸入您的症狀描述。</div>`;
                return;
            }

            suggestionResult.innerHTML = `<div class="alert alert-info">正在分析中...</div>`;

            const response = await fetch(`${URL}/api/suggest-department`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ symptoms: symptoms })
            });
            const data = await response.json();

            if (data.emergency) {
                suggestionResult.innerHTML = `
                    <div class="alert alert-danger">
                        <h4 class="alert-heading">緊急狀況警告！</h4>
                        <p>您描述的症狀包含「<b>${data.matched_keyword}</b>」，這可能屬於緊急情況。</p>
                        <hr>
                        <p class="mb-0 fw-bold">請立即撥打 119 或前往就近的急診室尋求協助。本系統無法為緊急狀況提供建議。</p>
                    </div>`;
                return; // 中斷後續流程
            }


            if (data.departments && data.departments.length > 0) {
                const recommendedDept = data.departments[0];
                suggestionResult.innerHTML = `
                    <div class="alert alert-success">
                        <p class="mb-2">根據您的描述，我們推薦您可以前往「<b>${recommendedDept}</b>」。</p>
                        <button class="btn btn-primary" onclick="enableStep2('${recommendedDept}')">
                            已搜尋到結果！前往「依地區搜尋」尋找 ${recommendedDept} 診所
                        </button>
                    </div>`;
            } else {
                suggestionResult.innerHTML = `<div class="alert alert-danger">無法根據您的描述找到對應的科別，建議您直接選擇「家庭醫學科」或「西醫一般科」進行諮詢。</div>`;
            }
        }

        // 【修改】根據特約類別和看診狀態，產生對應的 Leaflet 圖標 (包含大小)
        function getClinicIcon(clinic, status) {
            // let iconHtml = '<i class="fa-solid fa-house-medical"></i>'; // 預設圖示
            let iconHtml, className = 'custom-div-icon ', iconSize, innerIconSize;
            const type = clinic['特約類別_描述'] || '其他或未提供';

            if (type.includes('醫學中心')) {
                className += 'icon-medical-center';
                iconSize = [50, 50];
                innerIconSize = 25;
            } else if (type.includes('區域醫院')) {
                className += 'icon-regional-hospital';
                iconSize = [40, 40];
                innerIconSize = 20;
            } else if (type.includes('地區醫院')) {
                className += 'icon-district-hospital';
                iconSize = [35, 35];
                innerIconSize = 18;
            } else { // 基層院所
                className += 'icon-clinic';
                iconSize = [25, 25];
                innerIconSize = 13;
            }

            // 決定基礎圖示的 class
            let iconClass = 'fa-solid ';
            if      (type.includes('醫學中心')) iconClass += 'fa-hospital';
            else if (type.includes('區域醫院')) iconClass += 'fa-house-medical-flag';
            else if (type.includes('地區醫院')) iconClass += 'fa-house-chimney-medical';
            else if (type.includes('基層院所')) iconClass += 'fa-house-medical';
            else if (type.includes('未提供'))   iconClass += 'fa-square-plus'; 
            else                               iconClass += 'fa-square-plus'; 

            // 根據狀態決定最終樣式
            if (status.status === 'closed') {
                className += ' icon-closed';
            } else if (status.status === 'no-data') {
                iconClass = 'fa-solid fa-square-plus'; // 無資料時，覆蓋為問號
                className += ' icon-no-data';
            }

            // 【邏輯修改】將動態計算的字體大小寫入 inline style
            iconHtml = `<i class="${iconClass}" style="font-size: ${innerIconSize}px;"></i>`;

            return L.divIcon({
                html: iconHtml,
                className: className,
                iconSize: iconSize,
                iconAnchor: [iconSize[0] / 2, iconSize[1] / 2], // 中心點對齊
                popupAnchor: [0, -iconSize[1] / 2] // 彈出視窗位置
            });
        }

        //根據當前時間判斷診所是否營業
        function getServiceStatus(clinic) {
            const days = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
            const times = ['am', 'pm', 'eve'];
            
            // 步驟 1: 檢查是否有任何有效的服務時段資料
            let hasServiceData = true;
            for (const day of days) {
                for (const time of times) {
                    const timeSlotData = clinic[`${day}_${time}`];
                    if (timeSlotData == null || timeSlotData === '未提供') {
                        hasServiceData = false;
                        break;
                    }
                }
                if (!hasServiceData) break;
            }

            if (!hasServiceData) {
                return { status: 'no-data', text: "無看診時段資訊" };
            }
            
            // 步驟 2: 如果有資料，再判斷當下是否營業
            const now = new Date();
            const dayOfWeek = now.getDay(); // 0=週日, 1=週一, ..., 6=週六
            const hour = now.getHours();
            const currentDay = days[dayOfWeek];
            
            let timeSlot = '';
            if (hour >= 8 && hour < 12) timeSlot = 'am';
            else if (hour >= 14 && hour < 18) timeSlot = 'pm';
            else if (hour >= 18 && hour < 22) timeSlot = 'eve';
            
            if (!timeSlot) {
                return { status: 'closed', text: "休息中" };
            }

            const statusCol = `${currentDay}_${timeSlot}`;
            const isOpen = clinic[statusCol] === 1;

            return {
                status: isOpen ? 'open' : 'closed',
                text: isOpen ? "看診中" : "休息中"
            };
        }

        //將服務時段資料格式化為 HTML 表格
        function formatServiceHours(clinic) {
            let html = '<table class="service-hours-table"><thead><tr><th></th><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th><th>日</th></tr></thead><tbody>';
            const times = [{key: 'am', name: '上午'}, {key: 'pm', name: '下午'}, {key: 'eve', name: '晚上'}];
            const days = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
            
            times.forEach(time => {
                html += `<tr><td>${time.name}</td>`;
                days.forEach(day => {
                    const colName = `${day}_${time.key}`;
                    const isOpen = clinic[colName] === 1;
                    const isDataProvided = clinic[colName] !== '未提供';
                    // 根據是否有資料和是否營業來決定顯示內容
                    let cellContent = '—';
                    let cellClass = '';
                    if (isDataProvided) {
                        if (isOpen) {
                            cellContent = '●';
                            cellClass = 'open';
                        }
                    } else {
                        cellContent = '?';
                        cellClass = 'no-data-text';
                    }
                    
                    html += `<td class="${cellClass}">${cellContent}</td>`;
                });
                html += '</tr>';
            });

            html += '</tbody></table>';
            return html;
        }


        function getPopupServiceInfo(clinic, status) {
            if (status.status === 'no-data') {
                return `<br><span class="popup-status-no-data">無看診時段資訊</span>`;
            }

            if (status.status === 'open') {
                const hour = new Date().getHours();
                let currentSession = '';
                if      (hour >=  8 && hour < 12) currentSession = '上午診';
                else if (hour >= 14 && hour < 18) currentSession = '下午診';
                else if (hour >= 18 && hour < 22) currentSession = '晚上診';
                return `<br><span class="popup-status-open">今日 ${currentSession} 服務中</span>`;
            } else {
                const now = new Date();
                const dayOfWeek = now.getDay();
                const hour = now.getHours();
                const daysMap = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
                const dayNames = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
                const timesMap = [
                    { key: 'am', name: '上午診' },
                    { key: 'pm', name: '下午診' },
                    { key: 'eve', name: '晚上診' }
                ];
                for (let i = 0; i < 7; i++) {
                    const checkDayIndex = (dayOfWeek + i) % 7;
                    const checkDayKey = daysMap[checkDayIndex];
                    for (const time of timesMap) {
                        if (i === 0) {
                            if (time.key === 'am' && hour >= 12) continue;
                            if (time.key === 'pm' && hour >= 18) continue;
                            if (time.key === 'eve' && hour >= 22) continue;
                        }
                        const colName = `${checkDayKey}_${time.key}`;
                        if (clinic[colName] == 1) {
                            let dayLabel = '';
                            if (i === 0) {
                                dayLabel = '今天';
                            } else if (i === 1) {
                                dayLabel = '明天';
                            } else {
                                dayLabel = dayNames[checkDayIndex];
                            }
                            return `<br><span class="popup-status-closed">下次看診: ${dayLabel} ${time.name}</span>`;
                        }
                    }
                }
                return '<br><span class="popup-status-closed">近期無看診時段</span>';
            }
        }

            catch (e) {
                console.error("在處理診所列表時發生錯誤:", e);
                listElement.innerHTML = '<li class="list-group-item text-danger">處理結果時發生錯誤，請查看主控台。</li>';
            }
            /*
            // 調整地圖邊界以適應所有圖標
            const allVisibleLayers = L.featureGroup([...markerClusterGroup.getLayers(), ...userMarkerLayer.getLayers()]);
            if (allVisibleLayers.getLayers().length > 0) {
                 setTimeout(() => {
                    // 使用 cluster group 的 getBounds() 來取得所有圖標的範圍
                    map.flyToBounds(markerClusterGroup.getBounds().pad(0.1));
                }, 100);
            }
            */
        }

        // 點擊列表，聚焦地圖圖標
        function focusOnMapMarker(index) {
            const targetMarker = clinicMarkers[index];
            if (!targetMarker) return;
            markerClusterGroup.zoomToShowLayer(targetMarker, () => targetMarker.openPopup());
            mapContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        
        // 【新功能】點擊 Popup，聚焦列表項目
        function focusOnListItem(index) {
            const listItem = document.getElementById(`list-item-${index}`);
            if (!listItem) return;
            listItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
            listItem.classList.add('list-item-highlight');
            setTimeout(() => listItem.classList.remove('list-item-highlight'), 1500);
        }

        // 【新功能】地圖置中函式
        function recenterMap() {
            if (!map || !mapCenterInfo) return;
            if (mapCenterInfo.type === 'bounds') map.flyToBounds(mapCenterInfo.bounds.pad(0.1));
            else if (mapCenterInfo.type === 'user') map.flyTo(mapCenterInfo.layer.getLatLng(), 15);
        }
        // 統一 Header 點擊處理函式
        function handleHeaderClick(stepNumber) {
            // 如果該步驟不可點擊 (例如還沒選科別)，則不執行任何動作
            if ((stepNumber === 1 && !step1Header.classList.contains('clickable')) || 
                (stepNumber === 2 && !step2Header.classList.contains('clickable'))) return;

            // 在切換前，先取消所有可能正在進行中的操作
            deactivateMapClickSearch();

            const isStep1Click = (stepNumber === 1);
            const bodyToShow = isStep1Click ? step1Body : step2Body;
            // const bodyToHide = isStep1Click ? step2Body : step1Body;
            
            // 檢查點擊的區塊是否已經是打開的
            const isAlreadyOpen = !bodyToShow.classList.contains('d-none');

            // 1. 先無條件關閉所有區塊
            step1Body.classList.add('d-none');
            step2Body.classList.add('d-none');

            // 2. 如果點擊的區塊原本不是打開的，就把它打開
            if (!isAlreadyOpen) {
                bodyToShow.classList.remove('d-none');
                
                // 特別處理第一步：展開時，顯示重新確認的介面
                if (isStep1Click) {
                    chatInputGroup.classList.add('d-none');
                    suggestionResult.classList.add('d-none');
                    restartConfirmation.classList.remove('d-none');
                }
            }
        }

            if (!selectedDepartment) return;
            step1Body.classList.remove('d-none');
            chatInputGroup.classList.add('d-none');
            suggestionResult.classList.add('d-none');
            restartConfirmation.classList.remove('d-none');
            step1Summary.classList.add('d-none');
            step1Header.classList.remove('clickable');
            step2Body.classList.add('d-none');
            if (selectedLocationInfo) step2Summary.classList.remove('d-none');
            step2Header.classList.add('clickable');
        }

        // 取消重新分析，回到第二步
        function editStep2() {
            if (!selectedDepartment) return;
            resultSection.classList.add('d-none');
            step1Body.classList.remove('d-none');
           
            // 【新功能】如果結果區是可見的，點擊第二步標題時，只展開第二步，不隱藏結果
            if (!resultSection.classList.contains('d-none')) {
                step1Body.classList.add('d-none');
                step1Summary.classList.remove('d-none');
                step1Header.classList.add('clickable');

                step2Body.classList.remove('d-none');
                step2Summary.classList.add('d-none');
                step2Header.classList.remove('clickable');

        }

        // 取消重新分析，回到第二步
        function cancelRestart() {
            // 隱藏第一步的區塊
            step1Body.classList.add('d-none');
            /*
            // 顯示第一步的摘要
            step1Summary.classList.remove('d-none');
            step1Header.classList.add('clickable');

            // 如果已經有地點資訊，就直接回到第二步
            if (selectedLocationInfo) {
                step2Body.classList.remove('d-none');
                step2Summary.classList.add('d-none');
                step2Header.classList.remove('clickable');
            }
            */
        }
        
        // 確認重新分析
        function restartChat() {
            // 重設變數
            currentQuestionIndex = 0;
            userAnswers = [];
            selectedDepartment = null;
            selectedLocationInfo = '';
            mapCenterInfo = null;

            // 清空畫面
            suggestionResult.innerHTML = '';
            chatWindow.innerHTML = '';
            
            // 隱藏確認選項，顯示對話輸入框
            restartConfirmation.classList.add('d-none');
            chatInputGroup.classList.remove('d-none');
            
            // 重設卡片狀態
            step1Header.classList.remove('clickable');
            step1Summary.classList.add('d-none');
            step1Body.classList.remove('d-none');

            step2Card.classList.add('disabled');
            step2Header.classList.remove('clickable');
            step2Body.classList.remove('d-none');
            step2Content.classList.add('d-none');
            step2Instruction.classList.remove('d-none');
            step2Summary.classList.add('d-none');

            resultSection.classList.add('d-none');

            // 重新開始對話
            startChat();
        }
        
        
        // 啟用第二層的函式
        function enableStep2(department) {
            if (!department) {
                // editStep1();
                return;
            }
            selectedDepartment = department;

            // deptSelect.value = department;

            // 更新第一步為摘要模式
            step1Summary.textContent = `AI 建議科別：${department}`;
            step1Summary.classList.remove('d-none');
            // 【修改】完成分析後，直接隱藏整個第一步的 body
            step1Body.classList.add('d-none');
            step1Header.classList.add('clickable');

            // 啟用並顯示第二步
            step2Card.classList.remove('disabled');
            step2Body.classList.remove('d-none');
            step2Summary.classList.add('d-none');
            step2Header.classList.remove('clickable');
            step2Instruction.classList.add('d-none');
            step2Content.classList.remove('d-none');

            // 隱藏結果
            resultSection.classList.add('d-none');
            mapCenterInfo = null;
            step2Card.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
