<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <!-- 加入這行來告訴手機瀏覽器如何正確縮放頁面 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>找醫生 - 智慧醫療導航</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- 引入 Font Awesome 圖標庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <!-- Marker Cluster 的 CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.1/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <!-- 黑暗模式切換按鈕 -->
    <div id="theme-toggle">
        <i class="fas fa-sun"></i>
    </div>

    <div class="container">
        <h1 class="mb-4 text-center">找醫生 - 智慧醫療導航</h1>

        <!-- 第一層：決定科別 -> 改為對話介面 -->
        <div class="card mb-4" id="step1-card">
            <div class="card-header fs-5 fw-bold" id="step1-header">
                第一步：智慧問答
                <span id="step1-summary" class="fs-6 fw-normal text-primary ms-3 d-none"></span>
            </div>
            <div class="card-body" id="step1-body">
                <!-- 將對話介面與重新分析選項包裝起來 -->
                <div id="chat-container">
                    <div id="chat-window"></div>
                    <!-- 【修改】為輸入區塊加上 ID，方便控制顯示/隱藏 -->
                    <div class="input-group" id="chat-input-group">
                        <input type="text" id="chat-input" class="form-control" placeholder="請在這裡輸入..." disabled>
                        <button id="chat-send-btn" class="btn btn-primary" disabled>傳送</button>
                    </div>
                </div>
                <div id="restart-confirmation" class="text-center d-none mt-3">
                    <p>您確定要重新開始智慧問診嗎？目前的分析結果將會被清除。</p>
                    <button class="btn btn-danger" onclick="restartChat()">是，重新開始</button>
                    <button class="btn btn-secondary" onclick="cancelRestart()">否，取消</button>
                </div>
                <div id="suggestion-result" class="mt-3"></div>
            </div>
        </div>

        <!-- 【核心修改】第二層：決定地點 -->
        <div class="card mb-4 disabled" id="step2-card">
            <div class="card-header fs-5 fw-bold" id="step2-header">
                第二步：您想在哪裡找？
                <span id="step2-summary" class="fs-6 fw-normal text-primary ms-3 d-none"></span>
            </div>
            <div class="card-body" id="step2-body">
                <div id="step2-instruction" class="alert alert-info">請先在第一步選擇科別</div>
                <div id="step2-content" class="d-none">
                    <div class="row g-3 align-items-end mb-4">
                        <div class="col-md-4"><label for="city-select" class="form-label"><b>選項 A:</b> 依地區</label><select id="city-select" class="form-select"></select></div>
                        <div class="col-md-4"><label for="district-select" class="form-label">&nbsp;</label><select id="district-select" class="form-select"></select></div>
                        <div class="col-md-auto"><button onclick="searchClinicsByArea()" class="btn btn-primary w-100">搜尋</button></div>
                    </div>
                    <hr>
                    <div class="row g-3 align-items-end mb-2">
                        <div class="col-md-4"><label for="radius-select" class="form-label"><b>選項 B:</b> 依我附近 (半徑)</label><select id="radius-select" class="form-select"><option value="1">1 km</option><option value="3" selected>3 km</option><option value="5">5 km</option></select></div>
                        <div class="col-md-auto"><button onclick="searchClinicsNearby()" class="btn btn-success">取得我的位置</button></div>
                        <div class="col-md-auto"><button id="map-select-btn" onclick="activateMapClickSearch()" class="btn btn-outline-info">在地圖上選取</button></div>
                    </div>
                    <div class="row g-3 align-items-end">
                            <div class="col-md-8"><input type="text" id="address-input" class="form-control" placeholder="或輸入地址作為中心點"></div>
                            <div class="col-md-auto"><button onclick="searchClinicsByAddress()" class="btn btn-secondary">以此地址搜尋</button></div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 第三層：結果顯示 -->
        <div id="result-section" class="d-none">
            <hr>
            <h3 class="mb-3">搜尋結果</h3>
            <div id="map"></div>
            <ul id="clinic-list" class="list-group mt-3 mb-5"></ul>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Marker Cluster 的 JS -->
    <script src="https://unpkg.com/leaflet.markercluster@1.5.1/dist/leaflet.markercluster.js"></script>
    
    <script>
        // URL用判斷式就會爆開
        const URL = 'http://127.0.0.1:5001'; 
        //const URL = 'https://projmednav.onrender.com'; 

        let map = null, userMarkerLayer = null;
        let districtsData = {};
        let selectedDepartment = null, selectedLocationInfo = '';
        const markerClusterGroup = L.markerClusterGroup({ maxClusterRadius: 10 });
        let clinicMarkers = [];

        // --- DOM 元素 ---
        const themeToggle = document.getElementById('theme-toggle');
        const citySelect = document.getElementById('city-select');
        const districtSelect = document.getElementById('district-select');
        // const deptSelect = document.getElementById('dept-select');
        const radiusSelect = document.getElementById('radius-select');
        // const symptomInput = document.getElementById('symptom-input');
        // const addressInput = document.getElementById('address-input');
        const mapSelectBtn = document.getElementById('map-select-btn');
        
        const step1Card = document.getElementById('step1-card');
        const step1Header = document.getElementById('step1-header');
        const step1Body = document.getElementById('step1-body');
        const step1Summary = document.getElementById('step1-summary');

        const step2Card = document.getElementById('step2-card');
        const step2Header = document.getElementById('step2-header');
        const step2Body = document.getElementById('step2-body');
        const step2Summary = document.getElementById('step2-summary');
        const step2Instruction = document.getElementById('step2-instruction');
        const step2Content = document.getElementById('step2-content');
        
        const resultSection = document.getElementById('result-section');

        // --- 對話系統變數 ---
        const chatContainer = document.getElementById('chat-container');
        const restartConfirmation = document.getElementById('restart-confirmation');
        const chatWindow = document.getElementById('chat-window');
        const chatInput = document.getElementById('chat-input');
        const chatInputGroup = document.getElementById('chat-input-group');
        const chatSendBtn = document.getElementById('chat-send-btn');
        const suggestionResult = document.getElementById('suggestion-result');
        const questions = [
            "您好！為了更了解您的狀況，請用一句話描述您最主要的不舒服是什麼？ (例如：我從昨天開始頭很痛)",
            "這種不舒服的感覺大概持續多久了？",
            "除了這個主要症狀，還有沒有其他不舒服的地方？ (例如：發燒、噁心、視力模糊等等)",
            "請問您過去有相關的病史嗎？ (例如：高血壓、糖尿病，若無請回答「沒有」)",
        ];
        let currentQuestionIndex = 0;
        let userAnswers = [];            

        // 定義自訂圖標
        const clinicIcon = L.divIcon({
            html: '<i class="fa-solid fa-house-medical-circle-check fa-2x" style="color: #d9534f;"></i>',
            className: 'custom-div-icon',
            iconSize: [30, 42],
            iconAnchor: [15, 42],
            popupAnchor: [0, -45]
        });

        const userIcon = L.divIcon({
            html: '<i class="fa-solid fa-street-view fa-2x" style="color: #0275d8;"></i>',
            className: 'custom-div-icon',
            iconSize: [30, 42],
            iconAnchor: [15, 42],
            popupAnchor: [0, -45]
        });

        
        // 監聽事件
        step1Header.addEventListener('click', editStep1);
        step2Header.addEventListener('click', editStep2);
        citySelect.addEventListener('change', e => updateDistrictOptions(e.target.value));
        //deptSelect.addEventListener('change', e => enableStep2(e.target.value));
        // 處理使用者訊息傳送
        chatSendBtn.addEventListener('click', handleUserMessage);
        chatInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') handleUserMessage();
        });

        document.addEventListener('DOMContentLoaded', function() {
            // loadDepartments();
            loadDistricts();
            startChat();
        });

        // 切換主題 
        document.addEventListener('DOMContentLoaded', function() {
            // 【新增】檢查並應用儲存的主題
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
                themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
            } else {
                themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
            }
        });

        // 【新增】主題切換事件監聽
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
                themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
            } else {
                localStorage.setItem('theme', 'light');
                themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
            }
        });
        
        // 啟動對話流程
        function startChat() {
            displayBotMessage(questions[currentQuestionIndex]);
            chatInput.disabled = false;
            chatSendBtn.disabled = false;
            chatInput.focus();
        }

        async function handleUserMessage() {
            const message = chatInput.value.trim();
            if (!message) return;

            displayUserMessage(message);
            chatInput.value = '';
            chatInput.disabled = true;
            chatSendBtn.disabled = true;
            chatInput.placeholder = 'AI 正在分析您的回覆...';
            displayTypingIndicator(); // 顯示"輸入中"

            const currentQuestion = questions[currentQuestionIndex];

            try {
                const response = await fetch(`${URL}/api/validate-answer`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: currentQuestion, answer: message })
                });
                const validation = await response.json();
                chatInput.placeholder = '請在這裡輸入...';
                removeTypingIndicator(); // 移除"輸入中"

                if (validation.is_relevant) {
                    userAnswers.push(message);
                    currentQuestionIndex++;

                    if (currentQuestionIndex < questions.length) {
                        displayBotMessage(questions[currentQuestionIndex]);
                        chatInput.disabled = false;
                        chatSendBtn.disabled = false;
                        chatInput.focus();
                    } else {
                        displayBotMessage("好的，謝謝您的回答。我們正在為您分析最適合的科別...");
                        analyzeSymptoms();
                    }
                } else {
                    displayBotMessage(validation.feedback);
                    chatInput.disabled = false;
                    chatSendBtn.disabled = false;
                    chatInput.focus();
                }
            } catch (error) {
                removeTypingIndicator();
                console.error("Validation API error:", error);
                displayBotMessage("不好意思，系統暫時無法驗證您的回答，讓我們直接跳到下一題。");
                userAnswers.push(message);
                currentQuestionIndex++;
                if (currentQuestionIndex < questions.length) {
                    displayBotMessage(questions[currentQuestionIndex]);
                    chatInput.disabled = false;
                    chatSendBtn.disabled = false;
                    chatInput.focus();
                } else {
                     displayBotMessage("好的，謝謝您的回答。我們正在為您分析最適合的科別...");
                     analyzeSymptoms();
                }
            }
        }

        function displayTypingIndicator() {
            const typingElement = document.createElement('div');
            typingElement.className = 'chat-message bot-message typing-indicator-container';
            typingElement.innerHTML = `
                <i class="fa-solid fa-robot message-icon"></i>
                <div class="message-bubble typing-indicator">
                    <span></span><span></span><span></span>
                </div>
            `;
            chatWindow.appendChild(typingElement);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function removeTypingIndicator() {
            const indicator = chatWindow.querySelector('.typing-indicator-container');
            if (indicator) indicator.remove();
        }

        // 顯示機器人訊息
        function displayBotMessage(message) {
            const messageElement = document.createElement('div');
            messageElement.className = 'chat-message bot-message';
            messageElement.innerHTML = `
                <i class="fa-solid fa-robot message-icon"></i>
                <div class="message-bubble">${message}</div>
            `;
            chatWindow.appendChild(messageElement);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        // 顯示使用者訊息
        function displayUserMessage(message) {
            const messageElement = document.createElement('div');
            messageElement.className = 'chat-message user-message';
            messageElement.innerHTML = `
                <div class="message-bubble">${message}</div>
                <i class="fa-solid fa-user message-icon"></i>
            `;
            chatWindow.appendChild(messageElement);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        // 【修改】重新分析相關函式
        function restartChat() {
            currentQuestionIndex = 0;
            userAnswers = [];
            selectedDepartment = null;
            suggestionResult.innerHTML = '';
            chatWindow.innerHTML = '';
            
            restartConfirmation.classList.add('d-none');
            chatContainer.classList.remove('d-none');
            
            step1Header.classList.remove('clickable');
            step1Summary.classList.add('d-none');
            step1Body.classList.remove('d-none');

            step2Card.classList.add('disabled');
            resultSection.classList.add('d-none');

            startChat();
        }

        function cancelRestart() {
            step1Body.classList.add('d-none');
            step1Summary.classList.remove('d-none');
        }

        // 組合答案並呼叫後端 API
        async function analyzeSymptoms() {
            // 組合一個完整的摘要
            const summary = `
                主要症狀: ${userAnswers[0] || '未提供'}。
                持續時間: ${userAnswers[1] || '未提供'}。
                伴隨症狀: ${userAnswers[2] || '未提供'}。
                過去病史: ${userAnswers[3] || '未提供'}。
            `;
            suggestionResult.classList.remove('d-none');
                        
            // 使用舊的 suggestDepartment API 端點，傳入我們的摘要
            try {
                const response = await fetch(`${URL}/api/suggest-department`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ symptoms: summary.trim() })
                });

                // 【升級】處理後端回傳的完整分析結果
                const data = await response.json();

                if (data.error) {
                    suggestionResult.innerHTML = `<div class="alert alert-danger">分析時發生錯誤: ${data.error}</div>`;
                    return;
                }
                
                // 處理緊急狀況
                if (data.emergency) {
                    suggestionResult.innerHTML = `
                        <div class="alert alert-danger">
                            <h4 class="alert-heading">緊急狀況警告！</h4>
                            <p>您描述的症狀包含「<b>${data.matched_keyword}</b>」，這可能屬於緊急情況。</p>
                            <hr>
                            <p class="mb-0 fw-bold">請立即撥打 119 或前往就近的急診室尋求協助。</p>
                        </div>`;
                    return;
                }

                // 顯示 Gemini 的分析結果
                if (data.department) {
                    const recommendedDept = data.department;
                    const urgency = data.urgency_level || '未評估';
                    const reason = data.recommendation_reason || '無';

                    let alertClass = 'alert-success';
                    if (urgency === '建議盡快就醫') {
                        alertClass = 'alert-warning';
                    }

                    suggestionResult.innerHTML = `
                        <div class="alert ${alertClass}">
                            <h5 class="alert-heading">AI 分析結果</h5>
                            <p class="mb-1"><b>建議科別：</b> ${recommendedDept}</p>
                            <p class="mb-1"><b>緊急程度：</b> ${urgency}</p>
                            <p class="mb-2"><b>判斷原因：</b> ${reason}</p>
                            <hr>
                            <button class="btn btn-primary" onclick="enableStep2('${recommendedDept}')">
                                太好了！開始搜尋「${recommendedDept}」的診所
                            </button>
                        </div>`;
                } else {
                    suggestionResult.innerHTML = `<div class="alert alert-secondary">AI 助理無法判斷最適合的科別，建議您直接選擇「家庭醫學科」或「西醫一般科」進行諮詢。</div>`;
                }
            } catch (error) {
                console.error("分析症狀時發生錯誤:", error);
                suggestionResult.innerHTML = `<div class="alert alert-danger">分析時發生錯誤，建議您直接尋求醫療協助。</div>`;
            }
        }


        function initializeMap() {
            if (!map) {
                map = L.map('map').setView([25.033, 121.565], 11);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' }).addTo(map);
                // 【修改】將 markerClusterGroup 加入地圖
                map.addLayer(markerClusterGroup);
                userMarkerLayer = L.featureGroup().addTo(map);
            }
        }
        
        function loadDepartments(){
            fetch(`${URL}/api/departments`)
                .then(response => response.json()) 
                .then(depts => {
                    deptSelect.innerHTML = '<option value="">請選擇科別</option>';
                    depts.forEach(d => {
                        const opt = document.createElement('option');
                        opt.value = opt.textContent = d;
                        deptSelect.appendChild(opt);
                    });
                })
                .catch(error => {
                    console.error('無法載入科別列表:', error);
                    select.innerHTML = '<option value="">載入失敗</option>';
                });
        }
        

        function loadDistricts() {
            fetch(`${URL}/api/districts`)
                .then(response => response.json())
                .then(data => {
                    districtsData = data;
                    const cities = Object.keys(districtsData);
                    citySelect.innerHTML = '<option value="">請選擇縣市</option>';
                    cities.forEach(c => {
                        const opt = document.createElement('option');
                        opt.value = opt.textContent = c;
                        citySelect.appendChild(opt);
                    });
                    if (cities.length > 0) {
                        citySelect.value = cities[0];
                        updateDistrictOptions(cities[0]);
                    }
                })
                .catch(error => {
                    console.error('無法載入地區列表:', error);
                    citySelect.innerHTML = '<option value="">載入失敗</option>';
                });
        }

        function updateDistrictOptions(selectedCity) {
            const districts = districtsData[selectedCity] || [];
            districtSelect.innerHTML = '<option value="">全部</option>';
            districts.forEach(district => {
                const opt = document.createElement('option');
                opt.value = opt.textContent = district;
                districtSelect.appendChild(opt);
            });
        }
        /*
        function addSymptom(symptomText) {
            const currentText = symptomInput.value;
            symptomInput.value = currentText ? currentText + ' ' + symptomText : symptomText;
        }

        function clearSymptomInput() {
            symptomInput.value = '';
            suggestionResult.innerHTML = '';
        }
        */

        async function suggestDepartment() {
            const symptoms = symptomInput.value;
            if (!symptoms.trim()) {
                suggestionResult.innerHTML = `<div class="alert alert-warning">請輸入您的症狀描述。</div>`;
                return;
            }

            suggestionResult.innerHTML = `<div class="alert alert-info">正在分析中...</div>`;

            const response = await fetch(`${URL}/api/suggest-department`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ symptoms: symptoms })
            });
            const data = await response.json();

            if (data.emergency) {
                suggestionResult.innerHTML = `
                    <div class="alert alert-danger">
                        <h4 class="alert-heading">緊急狀況警告！</h4>
                        <p>您描述的症狀包含「<b>${data.matched_keyword}</b>」，這可能屬於緊急情況。</p>
                        <hr>
                        <p class="mb-0 fw-bold">請立即撥打 119 或前往就近的急診室尋求協助。本系統無法為緊急狀況提供建議。</p>
                    </div>`;
                return; // 中斷後續流程
            }


            if (data.departments && data.departments.length > 0) {
                const recommendedDept = data.departments[0];
                suggestionResult.innerHTML = `
                    <div class="alert alert-success">
                        <p class="mb-2">根據您的描述，我們推薦您可以前往「<b>${recommendedDept}</b>」。</p>
                        <button class="btn btn-primary" onclick="enableStep2('${recommendedDept}')">
                            已搜尋到結果！前往「依地區搜尋」尋找 ${recommendedDept} 診所
                        </button>
                    </div>`;
            } else {
                suggestionResult.innerHTML = `<div class="alert alert-danger">無法根據您的描述找到對應的科別，建議您直接選擇「家庭醫學科」或「西醫一般科」進行諮詢。</div>`;
            }
        }




        function searchClinicsByArea() {
            if (!selectedDepartment) return alert('請先在第一步選擇科別。');
            const city = citySelect.value;
            const district = districtSelect.value;
            selectedLocationInfo = `地點：${city} ${district}`;
            const url = `${URL}/search?city=${city}&district=${district}&department=${selectedDepartment}`;
            fetchAndDisplayClinics(url);
        }

        function searchClinicsNearby() {
            if (!selectedDepartment) return alert('請先在第一步選擇科別。');
            if (!navigator.geolocation) return alert('您的瀏覽器不支援地理位置功能。');
            navigator.geolocation.getCurrentPosition(pos => {
                selectedLocationInfo = '地點：我的附近';
                searchFromCoordinates(pos.coords.latitude, pos.coords.longitude);
            });
        }

        async function searchClinicsByAddress() {
            if (!selectedDepartment) return alert('請先在第一步選擇科別。');
            const address = addressInput.value;
            if (!address.trim()) return alert('請輸入地址。');

            selectedLocationInfo = `地點：${address}`;

            const listElement = document.getElementById('clinic-list');
            listElement.innerHTML = `<li class="list-group-item">正在定位地址: ${address}...</li>`;

            try {
                const response = await fetch(`${URL}/api/geocode?address=${encodeURIComponent(address)}`);
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || '地址解析失敗');
                }
                const coords = await response.json();
                searchFromCoordinates(coords.lat, coords.lng);
            } catch (error) {
                console.error('地址解析錯誤:', error);
                alert(`無法找到您輸入的地址，請檢查後再試一次。\n錯誤訊息: ${error.message}`);
                listElement.innerHTML = '';
            }
        }

        function activateMapClickSearch() {
            if (!selectedDepartment) return alert('請先在第一步選擇科別。');
            selectedLocationInfo = '地點：地圖選取點';
            resultSection.classList.remove('d-none');

            initializeMap();
            map.getContainer().classList.add('map-click-mode');
            mapSelectBtn.textContent = '請在地圖上點選位置...';
            mapSelectBtn.disabled = true; // 暫時禁用按鈕避免重複點擊
            map.once('click', function(e) {
                searchFromCoordinates(e.latlng.lat, e.latlng.lng);
                map.getContainer().classList.remove('map-click-mode');
                mapSelectBtn.textContent = '在地圖上選取中心點';
                mapSelectBtn.disabled = false;
            });
        }
        
        function searchFromCoordinates(lat, lon) {
            if (!selectedDepartment) return;
            initializeMap();
            const radius = radiusSelect.value;
            const url = `${URL}/search/nearby?lat=${lat}&lon=${lon}&radius=${radius}&department=${selectedDepartment}`;
            
            userMarkerLayer.clearLayers();
            // 【修改】使用自訂圖標
            L.marker([lat, lon], { icon: userIcon }).addTo(userMarkerLayer).bindPopup('搜尋中心點').openPopup();
            fetchAndDisplayClinics(url, true);
        }


        /* --- 【核心修改】圖標與服務時間相關函式 --- */

        //根據特約類別和看診狀態，產生對應的 Leaflet 圖標
        function getClinicIcon(clinic, isOpen) {
            let iconHtml = '<i class="fa-solid fa-house-medical"></i>'; // 預設圖示
            let className = 'custom-div-icon ';
            const type = clinic['特約類別_描述'] || '基層院所';

            if (type.includes('醫學中心')) {
                iconHtml = '<i class="fa-solid fa-hospital"></i>';
                className += 'icon-medical-center';
            } else if (type.includes('區域醫院')) {
                iconHtml = '<i class="fa-solid fa-hospital-user"></i>';
                className += 'icon-regional-hospital';
            } else if (type.includes('地區醫院')) {
                iconHtml = '<i class="fa-solid fa-house-medical-flag"></i>';
                className += 'icon-district-hospital';
            } else { // 基層院所
                className += 'icon-clinic';
            }

            // 根據看診狀態決定是否加上 'closed' 樣式
            if (!isOpen) {
                className += ' icon-closed';
            }

            return L.divIcon({
                html: iconHtml,
                className: className,
                iconSize: [30, 30],
                iconAnchor: [15, 15],
                popupAnchor: [0, -15]
            });
        }

        //根據當前時間判斷診所是否營業
        function getServiceStatus(clinic) {
            const now = new Date();
            const dayOfWeek = now.getDay(); // 0=週日, 1=週一, ..., 6=週六
            const hour = now.getHours();
            
            const daysMap = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
            const currentDay = daysMap[dayOfWeek];
            
            let timeSlot = '';
            if (hour >= 8 && hour < 12) timeSlot = 'am';
            else if (hour >= 14 && hour < 18) timeSlot = 'pm';
            else if (hour >= 18 && hour < 22) timeSlot = 'eve';
            
            if (!timeSlot) {
                return { isOpen: false, text: "休息中" };
            }

            const statusCol = `${currentDay}_${timeSlot}`;
            const isOpen = clinic[statusCol] === 1;

            return {
                isOpen: isOpen,
                text: isOpen ? "看診中" : "休息中"
            };
        }

        //將服務時段資料格式化為 HTML 表格
        function formatServiceHours(clinic) {
            let html = '<table class="service-hours-table"><thead><tr><th></th><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th><th>日</th></tr></thead><tbody>';
            const times = [{key: 'am', name: '上午'}, {key: 'pm', name: '下午'}, {key: 'eve', name: '晚上'}];
            const days = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
            
            times.forEach(time => {
                html += `<tr><td>${time.name}</td>`;
                days.forEach(day => {
                    const colName = `${day}_${time.key}`;
                    const isOpen = clinic[colName] === 1;
                    html += `<td class="${isOpen ? 'open' : ''}">${isOpen ? '●' : '—'}</td>`;
                });
                html += '</tr>';
            });

            html += '</tbody></table>';
            return html;
        }


        function getPopupServiceInfo(clinic, status) {
            const now = new Date();
            const dayOfWeek = now.getDay();
            const hour = now.getHours();
            const daysMap = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
            const dayNames = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
            const timesMap = [
                { key: 'am', name: '上午診' },
                { key: 'pm', name: '下午診' },
                { key: 'eve', name: '晚上診' }
            ];
            if (status.isOpen) {
                let currentSession = '';
                if (hour >= 8 && hour < 12) currentSession = '上午診';
                else if (hour >= 14 && hour < 18) currentSession = '下午診';
                else if (hour >= 18 && hour < 22) currentSession = '晚上診';
                return `<br><span class="popup-status-open">今日 ${currentSession} 服務中</span>`;
            } else {
                for (let i = 0; i < 7; i++) {
                    const checkDayIndex = (dayOfWeek + i) % 7;
                    const checkDayKey = daysMap[checkDayIndex];
                    for (const time of timesMap) {
                        if (i === 0) {
                            if (time.key === 'am' && hour >= 12) continue;
                            if (time.key === 'pm' && hour >= 18) continue;
                            if (time.key === 'eve' && hour >= 22) continue;
                        }
                        const colName = `${checkDayKey}_${time.key}`;
                        if (clinic[colName] === 1) {
                            return `<br><span class="popup-status-closed">下次看診: ${dayNames[checkDayIndex]} ${time.name}</span>`;
                        }
                    }
                }
                return '<br><span class="popup-status-closed">近期無看診時段</span>';
            }
        }

        async function fetchAndDisplayClinics(url, isNearbySearch = false) {
            resultSection.classList.remove('d-none');
            initializeMap();

            const listElement = document.getElementById('clinic-list');
            listElement.innerHTML = '<li class="list-group-item">搜尋中...</li>';

            // 清除舊的圖標
            markerClusterGroup.clearLayers();
            if (!isNearbySearch) userMarkerLayer.clearLayers();
            clinicMarkers = []; // 重置儲存的 marker 陣列

            try{
                const response = await fetch(url);
                if (!response.ok) throw new Error(`伺服器錯誤: ${response.status}`);
                const clinics = await response.json();

                // 搜尋完成後，將第二步也變為摘要模式
                step2Summary.textContent = selectedLocationInfo;
                step2Body.classList.add('d-none');
                step2Summary.classList.remove('d-none');
                step2Header.classList.add('clickable');

                listElement.innerHTML = '';
                if (clinics.length === 0) {
                    listElement.innerHTML = '<li class="list-group-item text-muted">找不到符合條件的醫療院所。</li>';
                    if (isNearbySearch) map.flyTo(userMarkerLayer.getBounds().getCenter(), 15);
                    return;
                }

                
                clinics.forEach((clinic, index) => {
                    const status = getServiceStatus(clinic);
                    const serviceHoursHtml = formatServiceHours(clinic);
                    const googleMapSearchName = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(clinic.縣市區名)}${encodeURIComponent(clinic.機構名稱)}`;
                    const li = document.createElement('li');
                    li.className = 'list-group-item';
                    const statusClass = status.isOpen ? 'open' : 'closed';
                    const distanceText = clinic.distance ? `${clinic.distance.toFixed(2)} km` : '';
                    /*
                    const name = clinic.機構名稱;
                    const address = clinic.地址;
                    const district = clinic.縣市區名;
                    const phone = clinic.電話;
                    */
                    li.innerHTML = `
                        <div class="d-flex w-100 justify-content-between">
                            <h5 class="mb-1">
                                <span class="status-dot ${statusClass}" title="${status.text}"></span>
                                ${clinic.機構名稱}
                            </h5>
                            <small class="distance-text">${distanceText}</small>
                        </div>
                        <div class="clinic-item-details">
                            <p class="mb-1"><i class="fa-solid fa-location-dot"></i> <a href="..." target="_blank">${clinic.地址}</a></p>
                            <p class="mb-1"><i class="fa-solid fa-phone"></i> ${clinic.電話 ? `<a href="tel:${clinic.電話}">${clinic.電話}</a>` : '未提供'}</p>
                            <p class="mb-1"><i class="fa-solid fa-hospital"></i> ${clinic['特約類別_描述'] || '未分類'}</p>
                        </div>
                        <div class="service-hours-container">
                            ${serviceHoursHtml}
                        </div>
                    `;

                    li.dataset.markerIndex = index;
                    /*
                    li.addEventListener('click', function() {
                        const targetMarker = clinicMarkers[this.dataset.markerIndex];
                        if (targetMarker) {
                            markerClusterGroup.zoomToShowLayer(targetMarker, () => {
                                targetMarker.openPopup();
                            });
                        }
                    });
                    */
                    listElement.appendChild(li);

                    if (clinic.latitude && clinic.longitude) {
                        // 使用自訂圖標
                        const marker = L.marker([clinic.latitude, clinic.longitude], { 
                            icon: getClinicIcon(clinic, status.isOpen)
                        });
                        const popupServiceInfo = getPopupServiceInfo(clinic, status);
                        const popupContent = `
                            <b>${clinic.機構名稱}</b>
                            ${popupServiceInfo}
                            <hr style="margin: 5px 0;">
                            <a href="${googleMapSearchName}" target="_blank" rel="noopener noreferrer" title="在 Google Maps 中開啟"><i class="fa-solid fa-map-location-dot"></i> 導航</a>
                            ${clinic.電話 ? ` | <a href="tel:${clinic.電話}" title="撥打電話"><i class="fa-solid fa-phone-volume"></i> 通話</a>` : ''}
                        `;
                        marker.bindPopup(popupContent);
                        marker.on('mouseover', function (e) { this.openPopup(); });
                        // 可選：滑鼠移開時關閉，但在觸控裝置上體驗可能不佳
                        // marker.on('mouseout', function (e) {this.closePopup();});

                        // 將 marker 存起來，而不是直接加入圖層
                        clinicMarkers.push(marker);
                    } else {
                        clinicMarkers.push(null); // 保持索引一致
                    }
                });
                // 一次性將所有 markers 加入 cluster group
                markerClusterGroup.addLayers(clinicMarkers.filter(m => m)); // 過濾掉 null 的 marker

                // 列表點擊事件，改用 cluster group 的方法
                listElement.querySelectorAll('li').forEach(li => {
                    li.addEventListener('click', function() {
                        const targetMarker = clinicMarkers[this.dataset.markerIndex];
                        if (targetMarker) {
                            // 這個函式會自動縮放到包含該 marker 的 cluster，並在最大縮放層級時展開它
                            markerClusterGroup.zoomToShowLayer(targetMarker, () => {
                                targetMarker.openPopup();
                            });
                        }
                    });
                });

            }
            catch (e) {
                console.error("在處理診所列表時發生錯誤:", e);
                listElement.innerHTML = '<li class="list-group-item text-danger">處理結果時發生錯誤，請查看主控台。</li>';
            }

            // 調整地圖邊界以適應所有圖標
            const allVisibleLayers = L.featureGroup([...markerClusterGroup.getLayers(), ...userMarkerLayer.getLayers()]);
            if (allVisibleLayers.getLayers().length > 0) {
                 setTimeout(() => {
                    // 使用 cluster group 的 getBounds() 來取得所有圖標的範圍
                    map.flyToBounds(markerClusterGroup.getBounds().pad(0.1));
                }, 100);
            }
        }
        
        // 返回第一步
        function editStep1() {
            // 如果科別都還沒選，就沒什麼好編輯的
            if (!selectedDepartment) return;
            // 顯示第一步的區塊
            step1Body.classList.remove('d-none');
            
            // 隱藏對話輸入框和 AI 分析結果，但保留對話紀錄
            chatInputGroup.classList.add('d-none');
            suggestionResult.classList.add('d-none');
            
            // 顯示「是否重新開始」的確認選項
            restartConfirmation.classList.remove('d-none');

            // 切換 Header 狀態
            step1Summary.classList.add('d-none');
            step1Header.classList.remove('clickable');

            // 將第二步收合
            step2Body.classList.add('d-none');
            step2Summary.classList.remove('d-none');
            step2Header.classList.add('clickable');
        }

        // 【核心修改】取消重新分析，回到第二步
        function editStep2() {
            if (!selectedDepartment) return;
            resultSection.classList.add('d-none');
            // 顯示第一步的區塊
            step1Body.classList.remove('d-none');
            // 隱藏對話輸入框和 AI 分析結果，但保留對話紀錄
            //chatInputGroup.classList.add('d-none');
            //suggestionResult.classList.add('d-none');
            
            // 顯示「是否重新開始」的確認選項
            // restartConfirmation.classList.remove('d-none');


            // 將第二步收合
            step2Body.classList.add('d-none');
            step2Summary.classList.remove('d-none');
            step2Header.classList.add('clickable');

            // 切換 Header 狀態
            step1Body.classList.add('d-none');
            step1Summary.classList.add('d-none');
            step1Header.classList.remove('clickable');
        }

        // 【核心修改】取消重新分析，回到第二步
        function cancelRestart() {
            // 隱藏第一步的區塊
            step1Body.classList.add('d-none');
            
            // 顯示第一步的摘要
            step1Summary.classList.remove('d-none');
            step1Header.classList.add('clickable');

            // 重新展開第二步
            step2Body.classList.remove('d-none');
            step2Summary.classList.add('d-none');
            step2Header.classList.remove('clickable');
        }
        
        // 【核心修改】確認重新分析
        function restartChat() {
            // 重設變數
            currentQuestionIndex = 0;
            userAnswers = [];
            selectedDepartment = null;
            
            // 清空畫面
            suggestionResult.innerHTML = '';
            chatWindow.innerHTML = '';
            
            // 隱藏確認選項，顯示對話輸入框
            restartConfirmation.classList.add('d-none');
            chatInputGroup.classList.remove('d-none');
            
            // 重設卡片狀態
            step1Header.classList.remove('clickable');
            step1Summary.classList.add('d-none');
            step1Body.classList.remove('d-none');

            step2Card.classList.add('disabled');
            resultSection.classList.add('d-none');

            // 重新開始對話
            startChat();
        }
        
        
        // 啟用第二層的函式
        function enableStep2(department) {
            if (!department) {
                editStep1();
                return;
            }
            selectedDepartment = department;

            // deptSelect.value = department;

            // 更新第一步為摘要模式
            step1Summary.textContent = `AI 建議科別：${department}`;
            step1Summary.classList.remove('d-none');
            // 【修改】完成分析後，直接隱藏整個第一步的 body
            step1Body.classList.add('d-none');
            step1Header.classList.add('clickable');

            // 啟用並顯示第二步
            step2Card.classList.remove('disabled');
            step2Body.classList.remove('d-none');
            step2Summary.classList.add('d-none');
            step2Header.classList.remove('clickable');
            step2Instruction.classList.add('d-none');
            step2Content.classList.remove('d-none');

            // 隱藏結果
            resultSection.classList.add('d-none');
            step2Card.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
